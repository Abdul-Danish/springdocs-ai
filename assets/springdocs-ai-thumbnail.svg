<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .display { font-family: 'IBM Plex Sans', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1210"/>
      <stop offset="100%" stop-color="#080B09"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39D97A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#39D97A" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur1"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint terminal scanlines -->
  <g stroke="#39D97A" stroke-opacity="0.06">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- signature: radar / target mark, echoing the sidebar icon -->
  <g transform="translate(880,300)">
    <circle r="190" fill="url(#glow)" filter="url(#blur1)"/>

    <!-- radar sweep arcs -->
    <circle r="150" fill="none" stroke="#245A3B" stroke-width="1"/>
    <circle r="110" fill="none" stroke="#2E7A4C" stroke-width="1"/>
    <circle r="70" fill="none" stroke="#39D97A" stroke-opacity="0.4" stroke-width="1.4"/>

    <path d="M 0 0 L 150 -18 A 150 150 0 0 1 150 18 Z" fill="#39D97A" opacity="0.10"/>

    <circle r="46" fill="none" stroke="#39D97A" stroke-width="3"/>
    <circle r="9" fill="#39D97A"/>

    <!-- crosshair ticks -->
    <g stroke="#39D97A" stroke-width="2">
      <line x1="0" y1="-150" x2="0" y2="-134"/>
      <line x1="0" y1="150" x2="0" y2="134"/>
      <line x1="-150" y1="0" x2="-134" y2="0"/>
      <line x1="150" y1="0" x2="134" y2="0"/>
    </g>
  </g>

  <!-- top-left product icon -->
  <rect x="80" y="76" width="56" height="56" rx="12" fill="#0E1613" stroke="#2E7A4C" stroke-width="1.5"/>
  <circle cx="108" cy="104" r="15" fill="none" stroke="#39D97A" stroke-width="2.5"/>
  <circle cx="108" cy="104" r="4" fill="#39D97A"/>

  <text x="152" y="98" class="display" font-size="17" font-weight="700" fill="#E9F7EE">SpringDocs AI</text>
  <text x="152" y="120" class="mono" font-size="13" fill="#4E9169" letter-spacing="0.5">SPRING BOOT REFERENCE ASSISTANT</text>

  <!-- headline -->
  <text x="80" y="330" class="display" font-size="62" font-weight="700" fill="#F1FBF4">SpringDocs AI</text>
  <text x="80" y="378" class="mono" font-size="22" fill="#39D97A">RAG + Ollama &#183; pgvector &#183; local-first</text>

  <text x="80" y="428" class="display" font-size="19" fill="#7FA98E">Grounded answers over the official Spring Boot docs.</text>

  <!-- fake terminal line, echoing the debug/API bar -->
  <rect x="78" y="470" width="520" height="42" rx="6" fill="#0E1613" stroke="#204030" stroke-width="1"/>
  <text x="94" y="497" class="mono" font-size="15" fill="#5FBF83">GET /api/v1/chat?message=...</text>

  <!-- status pill -->
  <circle cx="86" cy="560" r="4.5" fill="#39D97A"/>
  <text x="100" y="565" class="mono" font-size="14" fill="#39D97A">ready</text>
</svg>
